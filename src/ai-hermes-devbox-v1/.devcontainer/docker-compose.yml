services:
  devcontainer:
    # Pull the prebuilt image (CI builds it from this directory's Dockerfile
    # and publishes it as ai-hermes-devbox-v1-image). No local build step --
    # for an extra local layer, swap this for a `build:` block pointing at a
    # Dockerfile that does `FROM` this image. Requires `docker login
    # ghcr.io` (private package).
    image: ghcr.io/wesleycamargo/devcontainer-template/ai-hermes-devbox-v1-image:latest
    init: true
    environment:
      # Consumed by /usr/local/bin/sync-project-skills (run below, on every
      # start): keeps .agents/skills current with upstream and installs it
      # for every agent it detects installed, at project and global scope.
      # See that script for what each var does.
      SYNC_SKILLS_USER: vscode
      SYNC_SKILLS_AGENTS: "*"
    # Runs the skills sync once per start, then keeps the container running;
    # VS Code/the devcontainer CLI exec into it rather than relying on the
    # image's own entrypoint to block.
    command: ["/bin/sh", "-c", "sync-project-skills || true; sleep infinity"]
    # Nothing is published to the host. The Hermes dashboard (127.0.0.1:9119,
    # started by start-hermes.sh) is reached through VS Code's port forwarding
    # -- `forwardPorts` in devcontainer.json -- not a Docker published port,
    # which can't see a loopback listener.
    volumes:
      - ../..:/workspaces:cached
      # Named volumes make a fresh checkout usable on any host: Docker creates
      # them on demand and copies each image directory into it on first use.
      # They keep CLI logins across normal container rebuilds without depending
      # on personal host paths or baking credentials into the image.
      - claude-data:/home/vscode/.claude
      - codex-data:/home/vscode/.codex
      # Persist all Hermes state, including sessions, memories, skills,
      # credentials, and logs. Docker copies the image's installed Hermes
      # runtime into this named volume the first time it is created, so the
      # hermes launcher remains usable after a rebuild.
      - hermes-data:/home/vscode/.hermes

volumes:
  claude-data:
  codex-data:
  hermes-data:
