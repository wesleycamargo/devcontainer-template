services:
  devcontainer:
    # Pull the prebuilt image (CI builds it from this directory's Dockerfile
    # and publishes it as ai-hermes-devbox-image). No local build step --
    # for an extra local layer, swap this for a `build:` block pointing at a
    # Dockerfile that does `FROM` this image. Requires `docker login
    # ghcr.io` (private package).
    image: ghcr.io/wesleycamargo/devcontainer-template/ai-hermes-devbox-image:latest
    init: true
    # Keeps the container running; VS Code/the devcontainer CLI exec into it
    # rather than relying on the image's own entrypoint to block.
    command: sleep infinity
    # Hermes services published to the host. Hermes binds to 127.0.0.1 *inside
    # the container* by default, which a published port can't reach -- it has
    # to listen on 0.0.0.0 as well:
    #   Dashboard:  hermes dashboard --host 0.0.0.0
    #               (binding non-loopback makes Hermes refuse to start until an
    #               auth provider is configured under `dashboard` in
    #               ~/.hermes/config.yaml)
    #   Gateway:    set `gateway.api_server.host: 0.0.0.0` in ~/.hermes/config.yaml
    #               (or `API_SERVER_HOST=0.0.0.0 hermes gateway`), plus
    #               API_SERVER_KEY in ~/.hermes/.env -- required for every deploy.
    ports:
      - "9119:9119"   # hermes dashboard (web UI)
      - "8642:8642"   # hermes gateway (OpenAI-compatible API)
    volumes:
      - ..:/workspaces/devcontainer-template:cached
      # Agent CLI configs, bind-mounted from the host rather than COPYed into
      # the image -- these hold live credentials (.credentials.json, auth.json)
      # and baking them into image layers would persist them in `docker history`.
      # Personal host paths for this learning machine. Claude comes from the
      # WSL install (native fs, correct 0600 perms, and uid 1000 matches the
      # container's `vscode` user). On a different host account, edit/remove
      # these mounts rather than copying credentials into the image.
      - /mnt/c/Users/Wesle/.claude:/home/vscode/.claude
      - /mnt/c/Users/Wesle/.claude.json:/home/vscode/.claude.json
      # Codex only exists on this machine's Windows side, so this one crosses
      # /mnt/c and includes the local Windows user path.
      # Only auth.json, NOT the whole ~/.codex: the rest of that directory is
      # desktop-app state (Windows-path config.toml, plugin dirs, live SQLite
      # files the app holds locks on). The container gets its own ~/.codex from
      # the Dockerfile; sharing just the credentials file means token refreshes
      # stay in sync in both directions. See .devcontainer/README.md.
      - /mnt/c/Users/Wesle/.codex/auth.json:/home/vscode/.codex/auth.json
      # Hermes keeps everything under ~/.hermes, but that dir also holds the
      # cloned agent code, its uv venv, and live session/log state -- all of
      # which must stay container-local (the host copy is a Windows install).
      # So mount only the config files, the same way ~/.codex/auth.json is:
      # ~/.hermes is already created (owned by vscode) by the install.sh step
      # in the Dockerfile, so these file mounts don't make Docker create the
      # parent as root. Drop the config.yaml line if host/container settings
      # need to diverge; .env holds the API keys and is the one worth syncing.
      - /mnt/c/Users/Wesle/.hermes/.env:/home/vscode/.hermes/.env
      - /mnt/c/Users/Wesle/.hermes/config.yaml:/home/vscode/.hermes/config.yaml
      # Host git identity/credentials, read-only. postCreateCommand copies
      # these into ~/.gitconfig / ~/.git-credentials on container create.
      - /mnt/c/Users/Wesle/.gitconfig:/tmp/host-gitconfig:ro
      - /mnt/c/Users/Wesle/.git-credentials:/tmp/host-git-credentials:ro
