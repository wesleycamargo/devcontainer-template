services:
  devcontainer:
    # Pull the prebuilt image (CI builds it from this directory's Dockerfile
    # and publishes it as ai-hermes-devbox-image). No local build step --
    # for an extra local layer, swap this for a `build:` block pointing at a
    # Dockerfile that does `FROM` this image. Requires `docker login
    # ghcr.io` (private package).
    image: ghcr.io/wesleycamargo/devcontainer-template/ai-hermes-devbox-image:latest
    init: true
    # Keeps the container running; VS Code/the devcontainer CLI exec into it
    # rather than relying on the image's own entrypoint to block.
    command: sleep infinity
    # sshd (the `sshd` feature in devcontainer.json) for Hermes' SSH terminal
    # backend. Published on the host's loopback only -- unlike the dashboard,
    # sshd listens on all container interfaces, so a Docker port works here.
    ports:
      - "127.0.0.1:2222:2222"
    depends_on:
      ssh-pubkeys:
        condition: service_completed_successfully
    # The Hermes dashboard (127.0.0.1:9119, started by start-hermes.sh) is
    # reached from the host through VS Code's port forwarding -- `forwardPorts`
    # in devcontainer.json -- not a Docker published port, which can't see a
    # loopback listener.
    volumes:
      - ..:/workspaces/devcontainer-template:cached
      # Named volumes make a fresh checkout usable on any host: Docker creates
      # them on demand and copies each image directory into it on first use.
      # They keep CLI logins across normal container rebuilds without depending
      # on personal host paths or baking credentials into the image.
      - claude-data:/home/vscode/.claude
      - codex-data:/home/vscode/.codex
      # Persist all Hermes state, including sessions, memories, skills,
      # credentials, and logs. Docker copies the image's installed Hermes
      # runtime into this named volume the first time it is created, so the
      # hermes launcher remains usable after a rebuild.
      - hermes-data:/home/vscode/.hermes
      # Host public keys collected by ssh-pubkeys; postStartCommand installs
      # them as vscode's SSH authorized_keys.
      - ssh-pubkeys:/tmp/host-ssh-pubkeys:ro

  # One-shot: copies only the host's ~/.ssh/*.pub into the ssh-pubkeys volume
  # and exits, so the devcontainer (where agents run) never sees the private
  # keys next to them. Re-runs on every `up`, picking up new or removed keys.
  ssh-pubkeys:
    image: busybox:1.37
    volumes:
      - ${HOME:-${USERPROFILE:-}}/.ssh:/host-ssh:ro
      - ssh-pubkeys:/keys
    command:
      - sh
      - -c
      - cat /host-ssh/*.pub 2>/dev/null | tr -d '\r' > /keys/authorized_keys; chmod 644 /keys/authorized_keys

  # Shares the devcontainer's loopback namespace so its OpenAI connection can
  # reach Hermes at 127.0.0.1:8642 without exposing the API outside Compose.
  open-webui:
    # Pin a tested release. `main` is a moving development build and has
    # shipped SSE parsing regressions that break Hermes streaming replies.
    image: ghcr.io/open-webui/open-webui:v0.11.1
    network_mode: service:devcontainer
    depends_on:
      - devcontainer
    environment:
      OPENAI_API_BASE_URL: http://127.0.0.1:8642/v1
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui-data:/app/backend/data
      - .:/openwebui-config:ro
    command:
      - /bin/bash
      - -c
      - |
        while [ ! -s /openwebui-config/.openwebui.env ]; do sleep 1; done
        set -a
        . /openwebui-config/.openwebui.env
        set +a
        exec bash start.sh
    restart: unless-stopped

volumes:
  claude-data:
  codex-data:
  hermes-data:
  open-webui-data:
  ssh-pubkeys:
