services:
  devcontainer:
    # Pull the prebuilt image (CI builds it from this directory's Dockerfile
    # and publishes it as ai-hermes-devbox-image). No local build step --
    # for an extra local layer, swap this for a `build:` block pointing at a
    # Dockerfile that does `FROM` this image. Requires `docker login
    # ghcr.io` (private package).
    image: ghcr.io/wesleycamargo/devcontainer-template/ai-hermes-devbox-image:latest
    init: true
    # No `command:` override. The image's entrypoint runs sshd in the
    # foreground, so the container stays up on its own and is a working SSH
    # gateway whether it was started by Compose, `docker run`, or VS Code.
    #
    # The internal port is always 2222 (the container contract). Only the host
    # side varies, so several projects can run at once: set HERMES_SSH_PORT in
    # .env (see .env.example) to a value that is stable for this project.
    # Loopback-only, so nothing outside this machine can reach it.
    ports:
      - "127.0.0.1:${HERMES_SSH_PORT:-2222}:2222"
    environment:
      # Start the Hermes gateway + dashboard in this container. Open WebUI
      # below talks to the gateway, so Compose wants them; a bare `docker run`
      # gateway leaves this unset and gets sshd only.
      HERMES_AUTOSTART_SERVICES: "1"
      # The container cannot see its own published port -- pass it through so
      # `hermes-ssh-info` prints a host port you can actually connect to.
      HERMES_SSH_HOST_PORT: "${HERMES_SSH_PORT:-2222}"
      HERMES_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-hermes}"
      # Shared Hermes/Open WebUI key file, on the workspace mount so both
      # containers see it. Generated on first start if absent.
      HERMES_OPENWEBUI_ENV: /workspaces/devcontainer-template/.devcontainer/.openwebui.env
    depends_on:
      ssh-pubkeys:
        condition: service_completed_successfully
    # The Hermes dashboard (127.0.0.1:9119) and gateway (127.0.0.1:8642) are
    # not published: VS Code forwards the dashboard (`forwardPorts` in
    # devcontainer.json), and `ssh -L` can reach either through the gateway.
    volumes:
      - ..:/workspaces/devcontainer-template:cached
      # Named volumes make a fresh checkout usable on any host: Docker creates
      # them on demand and copies each image directory into it on first use.
      # They keep CLI logins across normal container rebuilds without depending
      # on personal host paths or baking credentials into the image.
      - claude-data:/home/vscode/.claude
      - codex-data:/home/vscode/.codex
      # Hermes USER DATA only -- credentials, config, sessions, memories,
      # skills, logs. Hermes' code and runtime now live in the image
      # (/usr/local/lib/hermes-agent, /opt/hermes), so pulling a newer image
      # actually upgrades Hermes. When this volume held the runtime too, Docker
      # seeded it once and every later upgrade was invisible.
      - hermes-data:/home/vscode/.hermes
      # Host public keys collected by ssh-pubkeys, at the contract path the
      # image reads. Read-only: the entrypoint copies them to vscode's
      # authorized_keys rather than using them in place.
      - ssh-pubkeys:/run/hermes-ssh:ro
      # The container's own SSH host identity. Persisted so a rebuild or
      # recreate does not change the fingerprint -- Hermes connects with
      # StrictHostKeyChecking=accept-new and would refuse a changed key.
      - ssh-host-keys:/var/lib/hermes-ssh/host_keys

  # One-shot: copies only the host's ~/.ssh/*.pub into the ssh-pubkeys volume
  # and exits, so the devcontainer (where agents run) never sees the private
  # keys next to them. Re-runs on every `up`, picking up new or removed keys.
  ssh-pubkeys:
    image: busybox:1.37
    volumes:
      - ${HOME:-${USERPROFILE:-}}/.ssh:/host-ssh:ro
      - ssh-pubkeys:/keys
    command:
      - sh
      - -c
      - cat /host-ssh/*.pub 2>/dev/null | tr -d '\r' > /keys/authorized_keys; chmod 644 /keys/authorized_keys

  # Shares the devcontainer's loopback namespace so its OpenAI connection can
  # reach Hermes at 127.0.0.1:8642 without exposing the API outside Compose.
  open-webui:
    # Pin a tested release. `main` is a moving development build and has
    # shipped SSE parsing regressions that break Hermes streaming replies.
    image: ghcr.io/open-webui/open-webui:v0.11.1
    network_mode: service:devcontainer
    depends_on:
      - devcontainer
    environment:
      OPENAI_API_BASE_URL: http://127.0.0.1:8642/v1
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui-data:/app/backend/data
      - .:/openwebui-config:ro
    command:
      - /bin/bash
      - -c
      - |
        while [ ! -s /openwebui-config/.openwebui.env ]; do sleep 1; done
        set -a
        . /openwebui-config/.openwebui.env
        set +a
        exec bash start.sh
    restart: unless-stopped

volumes:
  claude-data:
  codex-data:
  hermes-data:
  open-webui-data:
  ssh-pubkeys:
  ssh-host-keys:
