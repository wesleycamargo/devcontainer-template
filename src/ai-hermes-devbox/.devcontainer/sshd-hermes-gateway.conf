# Hermes SSH gateway -- installed to /etc/ssh/sshd_config.d/10-hermes-gateway.conf.
#
# Debian's stock sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`
# and OpenSSH keeps the FIRST value it sees for most keywords, so everything set
# here wins over the stock file below it.

# Stable container contract: the internal port never changes. Compose/`docker
# run` map a per-project host port onto it.
Port 2222

# Public keys only.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# Only the contract user may log in.
AllowUsers hermes

# Hermes forwards credentials to the remote shell with OpenSSH SendEnv; sshd
# drops any variable not listed here. LANG/LC_* keep locale-sensitive tools
# sane. Add further AcceptEnv lines if a skill needs more variables.
AcceptEnv LANG LC_* HERMES_*

# TCP forwarding stays on: it is how `ssh -L` reaches the loopback-bound Hermes
# gateway (8642) and dashboard (9119) from the host. X11 and agent forwarding
# are not used by this setup.
AllowTcpForwarding yes
X11Forwarding no
AllowAgentForwarding no

# Host keys live on a named volume so a rebuild/recreate keeps the same SSH
# identity. Hermes connects with StrictHostKeyChecking=accept-new, which
# REJECTS a changed key, so a regenerated host key would break saved
# connections. hermes-entrypoint creates these on first start.
HostKey /var/lib/hermes-ssh/host_keys/ssh_host_ed25519_key
HostKey /var/lib/hermes-ssh/host_keys/ssh_host_rsa_key

PrintMotd no
