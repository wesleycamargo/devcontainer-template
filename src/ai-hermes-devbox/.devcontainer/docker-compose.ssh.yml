# Optional host-side SSH access. Choose a distinct stable port per project.
# docker compose -f docker-compose.yml -f docker-compose.ssh.yml up -d
services:
  devcontainer:
    ports:
      - "127.0.0.1:${HERMES_SSH_PORT:-2222}:2222"
    environment:
      HERMES_SSH_HOST_PORT: "${HERMES_SSH_PORT:-2222}"
    depends_on:
      ssh-pubkeys:
        condition: service_completed_successfully
    volumes:
      - ssh-pubkeys:/run/hermes-ssh:ro

  # Only public keys reach the devcontainer; the collector exits before startup.
  ssh-pubkeys:
    image: busybox:1.37
    volumes:
      - ${HOME:-${USERPROFILE:-}}/.ssh:/host-ssh:ro
      - ssh-pubkeys:/keys
    command:
      - sh
      - -c
      - cat /host-ssh/*.pub 2>/dev/null | tr -d '\r' > /keys/authorized_keys; chmod 644 /keys/authorized_keys

volumes:
  ssh-pubkeys:
