services:
  devcontainer:
    # Pull the prebuilt image (CI builds it from this directory's Dockerfile
    # and publishes it as ai-hermes-devbox-image). No local build step --
    # for an extra local layer, swap this for a `build:` block pointing at a
    # Dockerfile that does `FROM` this public image. Registry login is not required.
    image: ghcr.io/wesleycamargo/devcontainer-template/ai-hermes-devbox-image:latest
    init: true
    # No `command:` override. The image's entrypoint runs sshd in the
    # foreground, so the container stays up on its own and is a working SSH
    # gateway whether it was started by Compose, `docker run`, or VS Code.
    #
    # No host port bindings: several devcontainers can start without collisions.
    # VS Code forwards the Webapp locally. External SSH is opt-in through
    # docker-compose.ssh.yml; sshd remains available inside the image on 2222.
    environment:
      # Start the Hermes gateway (with Webapp) + dashboard; a bare
      # `docker run` leaves this unset and gets sshd only.
      HERMES_AUTOSTART_SERVICES: "1"
      # Pins `hermes-ssh-info`'s suggested terminal.cwd to the workspace mount
      # below instead of its /workspaces/*/ auto-detect glob, which falls back
      # to /home/hermes if it ever can't find a match. Keep this in sync with
      # workspaceFolder (devcontainer.json) and the bind mount target (below).
      HERMES_SSH_CWD: "/workspaces"
    # Dashboard (9119) and Webapp (9120) default to container loopback and
    # are not published. VS Code forwards both locally; image users can opt
    # into remote Webapp access separately (see ../README.md).
    volumes:
      - ../..:/workspaces:cached
      # Docker creates the named volumes on demand and initializes them from
      # the image. Settings/history survive rebuilds; Codex auth comes from
      # the host file mounted below.
      - claude-data:/home/hermes/.claude
      - codex-data:/home/hermes/.codex
      # Authenticate once with Codex CLI on the host. Only its credential file
      # is shared; Codex configuration and history remain project-local.
      - type: bind
        source: ${DEVBOX_HOST_HOME:-${HOME:-/home/vscode}}/.codex/auth.json
        target: /home/hermes/.codex/auth.json
        bind:
          create_host_path: false
      # Persist Hermes configuration, sessions, plugins and dependency state.
      # Source code and the prepared runtime remain in the image at /opt/hermes.
      - hermes-data:/home/hermes/.hermes
      # The container's own SSH host identity. Persisted so a rebuild or
      # recreate does not change the fingerprint -- Hermes connects with
      # StrictHostKeyChecking=accept-new and would refuse a changed key.
      - ssh-host-keys:/var/lib/hermes-ssh/host_keys

volumes:
  claude-data:
  codex-data:
  hermes-data:
  ssh-host-keys:
