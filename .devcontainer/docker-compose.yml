services:
  devcontainer:
    # Pull the prebuilt image (CI builds it from
    # src/ai-hermes-devbox/.devcontainer/Dockerfile and publishes it as
    # ai-hermes-devbox-image -- the ai-devbox base plus the Hermes Agent,
    # full browser + computer-use install). No local build step -- for an
    # extra local layer, swap this for a `build:` block pointing at a
    # Dockerfile that does `FROM` this image. Requires `docker login
    # ghcr.io` (private package).
    image: ghcr.io/wesleycamargo/devcontainer-template/ai-hermes-devbox-image:latest
    init: true
    # No `command:` override: the image's entrypoint runs sshd in the
    # foreground, which keeps the container up and starts the Hermes services.
    #
    # This container now mirrors src/ai-hermes-devbox/'s SSH gateway wiring
    # (see SSH-BACKEND.md next to this file): the internal port is always
    # 2222, only the host side varies, so several projects can run at once.
    # Loopback-only, so nothing outside this machine can reach it.
    ports:
      - "127.0.0.1:${HERMES_SSH_PORT:-2222}:2222"
    environment:
      HERMES_AUTOSTART_SERVICES: "1"
      HERMES_PROJECT_NAME: "devcontainer-template"
      # The container cannot see its own published port -- pass it through so
      # `hermes-ssh-info` prints a host port you can actually connect to.
      HERMES_SSH_HOST_PORT: "${HERMES_SSH_PORT:-2222}"
      # Pins `hermes-ssh-info`'s suggested terminal.cwd to the workspace mount
      # below instead of its /workspaces/*/ auto-detect glob.
      HERMES_SSH_CWD: "/workspaces"
    depends_on:
      ssh-pubkeys:
        condition: service_completed_successfully
    # The Hermes dashboard (127.0.0.1:9119) is reached from the host through VS
    # Code's port forwarding -- `forwardPorts` in devcontainer.json -- not a
    # Docker published port, which can't see a loopback listener.
    volumes:
      - ../..:/workspaces:cached
      # Named volumes make a fresh checkout usable on any host: Docker creates
      # them on demand and copies each image directory into it on first use.
      # They keep CLI logins across normal container rebuilds without depending
      # on personal host paths or baking credentials into the image.
      - claude-data:/home/hermes/.claude
      - codex-data:/home/hermes/.codex
      # Hermes USER DATA only -- credentials, config, sessions, memories,
      # skills, logs. Hermes' code and runtime live in the image
      # (/usr/local/lib/hermes-agent, /opt/hermes), so pulling a newer image
      # actually upgrades Hermes. An existing volume may still contain
      # ~/.hermes/hermes-agent and ~/.hermes/node from an older image; they are
      # unused now and safe to delete by hand (the entrypoint says so on start).
      - hermes-data:/home/hermes/.hermes
      # Host public keys collected by ssh-pubkeys, at the contract path the
      # image reads. Read-only: the entrypoint copies them to hermes's
      # authorized_keys rather than using them in place.
      - ssh-pubkeys:/run/hermes-ssh:ro
      # Keeps this container's SSH host identity stable across recreates.
      - ssh-host-keys:/var/lib/hermes-ssh/host_keys

  # One-shot: copies only the host's ~/.ssh/*.pub into the ssh-pubkeys volume
  # and exits, so the devcontainer (where agents run) never sees the private
  # keys next to them. Re-runs on every `up`, picking up new or removed keys.
  ssh-pubkeys:
    image: busybox:1.37
    volumes:
      - ${HOME:-${USERPROFILE:-}}/.ssh:/host-ssh:ro
      - ssh-pubkeys:/keys
    command:
      - sh
      - -c
      - cat /host-ssh/*.pub 2>/dev/null | tr -d '\r' > /keys/authorized_keys; chmod 644 /keys/authorized_keys

volumes:
  claude-data:
  codex-data:
  hermes-data:
  ssh-pubkeys:
  ssh-host-keys:
