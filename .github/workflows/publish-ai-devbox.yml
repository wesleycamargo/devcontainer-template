name: Publish ai-devbox

# One publish workflow per devcontainer under src/. This one owns the
# `ai-devbox` template and the `ai-devbox-image` image, and only runs when
# `src/ai-devbox/**` changes. It shares nothing with the other publish-*.yml
# workflows -- separate version tags, parallel runs.

on:
  push:
    branches:
      - main
    paths:
      - 'src/ai-devbox/**'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TEMPLATE_ID: ai-devbox
      TAG_PREFIX: ai-devbox-v
      # First run has no ai-devbox-v* tag yet -- seed from the old repo-wide
      # v* line so the version continues instead of resetting to 0.1.0.
      LEGACY_TAG_GLOB: 'v[0-9]*.[0-9]*.[0-9]*'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version tag
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ] && [ -n "$LEGACY_TAG_GLOB" ]; then
            LEGACY=$(git tag --list "$LEGACY_TAG_GLOB" --sort=-v:refname | head -1)
            if [ -n "$LEGACY" ]; then LAST_TAG="${TAG_PREFIX}${LEGACY#v}"; fi
          fi
          if [ -z "$LAST_TAG" ]; then LAST_TAG="${TAG_PREFIX}0.0.0"; fi
          VERSION="${LAST_TAG#"$TAG_PREFIX"}"
          # devcontainers/action only moves the template's `latest` tag when the
          # new version is above everything already on GHCR. If the registry is
          # ahead of the git tags (e.g. versions from an older workflow), counting
          # from git alone publishes a lower version and `latest` silently stays
          # on the old template -- so continue from whichever is higher.
          TEMPLATE_REPO="${GITHUB_REPOSITORY,,}/${TEMPLATE_ID}"
          REGISTRY_TOKEN=$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${TEMPLATE_REPO}:pull&service=ghcr.io" | jq -r .token)
          STATUS=$(curl -sS -o registry-tags.json -w '%{http_code}' \
            -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
            "https://ghcr.io/v2/${TEMPLATE_REPO}/tags/list?n=1000")
          case "$STATUS" in
            200) PUBLISHED=$(jq -r '.tags[]?' registry-tags.json | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1) ;;
            404) PUBLISHED="" ;;  # template not published yet
            *) echo "::error::Listing ${TEMPLATE_REPO} tags on GHCR failed (HTTP ${STATUS})"; cat registry-tags.json; exit 1 ;;
          esac
          rm -f registry-tags.json
          if [ -n "$PUBLISHED" ] && [ "$(printf '%s\n' "$VERSION" "$PUBLISHED" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "GHCR already has ${PUBLISHED}, ahead of the git tags (${VERSION}); continuing from ${PUBLISHED}"
            VERSION="$PUBLISHED"
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ github.event.inputs.bump_type || 'minor' }}"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -q '\[major\]'; then
              BUMP_TYPE="major"
            elif echo "$COMMIT_MSG" | grep -q '\[minor\]'; then
              BUMP_TYPE="minor"
            elif echo "$COMMIT_MSG" | grep -q '\[patch\]'; then
              BUMP_TYPE="patch"
            else
              BUMP_TYPE="minor"
            fi
          fi
          if [ "$BUMP_TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$BUMP_TYPE" = "patch" ]; then
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          else
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          fi
          NEW_TAG="${TAG_PREFIX}${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in template
        run: |
          FILE="src/${TEMPLATE_ID}/devcontainer-template.json"
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' "$FILE" > tmp.json && mv tmp.json "$FILE"

      # devcontainers/action publishes every template dir under
      # base-path-to-templates. Stage just this one so the workflow doesn't
      # touch the other devcontainers' published templates.
      - name: Stage template
        run: |
          mkdir -p _publish
          cp -r "src/${TEMPLATE_ID}" "_publish/${TEMPLATE_ID}"

      - name: Publish template
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./_publish"
          generate-docs: "false"
          templates-namespace: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ env.TEMPLATE_ID }}/.devcontainer
          file: ./src/${{ env.TEMPLATE_ID }}/.devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.TEMPLATE_ID }}-image:latest
            ghcr.io/${{ github.repository }}/${{ env.TEMPLATE_ID }}-image:${{ steps.version.outputs.version }}
